# 1x3 grid
title_container_prefix: &title_container_prefix
  - type: text
    name: title
    label: 存储名称
    required: true
  - type: text
    name: container
    label: 容器名称
    required: true
  - type: text
    name: prefix
    label: 容器前缀

# 1x2 grid
azure_params: &azure_params
  - type: password
    name: account_name
    label: 账户名称
    autoComplete: "off"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true
  - type: password
    name: account_key
    label: 账户密钥
    autoComplete: "new-password"
    skipAutofill: true
    allowEmpty: false
    protectedValue: true

ImportStorage:
  # Title, Bucket, Prefix
  - columnCount: 3
    fields: *title_container_prefix
  # Regex filter
  - columnCount: 1
    fields:
      - type: text
        name: regex_filter
        label: 文件过滤正则表达式
        placeholder: '.*csv or .*(jpe?g|png|tiff) or .\w+-\d+.text'
        validators:
          - regexp
  # AWS specific params
  - columnCount: 3
    fields: *azure_params

  # Import method selection
  - columnCount: 1
    fields:
      - type: select
        name: use_blob_urls
        label: 导入方法
        description: 选择如何从存储导入数据
        placeholder: "选择一个选项"
        required: true
        options:
          - value: true
            label: "文件 - 自动为每个存储对象创建一个任务（例如 JPG、MP3、TXT）"
          - value: false
            label: "JSON - 将每个 JSON 或 JSONL 文件视为任务定义（每个文件一个或多个任务）"

  # 2 columns grid
  - columnCount: 2
    columns:
      - width: 468
        fields:
          - type: toggle
            name: presign
            label: "使用预签名 URL（开）\n 通过平台代理（关）"
            description: "当预签名 URL 启用时，所有数据绕过平台，用户浏览器直接从存储读取数据"
            value: true
      - fields:
          - type: counter
            name: presign_ttl
            label: 过期预签名 URL（分钟）
            min: 1
            value: 15
            dependency: presign

ExportStorage:
  - columnCount: 3
    fields: *title_container_prefix
  - columnCount: 2
    fields: *azure_params